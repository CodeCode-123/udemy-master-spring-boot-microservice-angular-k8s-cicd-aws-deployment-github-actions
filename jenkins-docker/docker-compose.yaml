version: '3.8'
services:
  jenkins:
#    build:
#      context: .
#      dockerfile: Dockerfile
#    container_name: jenkins-server
#    user: root
    build: ..
    container_name: jenkins-server
    user: "jenkins"
    privileged: true
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
#      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home: